[package]
name = "nex"
version = "0.1.0"
edition = "2021"
description = "Fast, lightweight AI coding agent for the terminal"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
colored = "3"
directories = "6"
async-trait = "0.1"